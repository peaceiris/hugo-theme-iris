name: "Pull Request Labeler"

on:
  pull_request_target:

jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: write
    steps:
      # https://github.com/actions/labeler
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          repo-token: ${{ github.token }}
