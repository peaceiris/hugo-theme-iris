name: "Pull Request Labeler"

on:
  pull_request_target:

jobs:
  triage:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: write
    steps:
      # https://github.com/actions/labeler
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ github.token }}
