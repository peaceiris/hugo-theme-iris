name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"
  schedule:
    - cron: "13 13 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_CACHEDIR: /home/runner/.cache/hugo

jobs:
  renovate:
    needs: envs
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/workflows/setup-node@2ac268509a354f2a6098d9995de4ab44f4f038b1 # v0.22.0
        with:
          node-version-file: ".nvmrc"
          npm-version: "${{ needs.envs.outputs.NPM_VERSION }}"
          cache: "npm"

      - run: npm ci
      - name: Verify RE2 native binding
        run: node -e 'new (require("re2"))(".*").test("test")'
      - run: npm run test:renovate

  envs:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      HUGO_VERSION: ${{ steps.envs.outputs.HUGO_VERSION }}
      NODE_VERSION: ${{ steps.envs.outputs.NODE_VERSION }}
      NPM_VERSION: ${{ steps.envs.outputs.NPM_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set envs
        id: envs
        run: |
          echo "HUGO_VERSION=$(make get-hugo-version)" | tee -a "${GITHUB_OUTPUT}"
          echo "NODE_VERSION=$(cat .nvmrc)" | tee -a "${GITHUB_OUTPUT}"
          echo "NPM_VERSION=$(jq -er '.engines.npm' package.json)" | tee -a "${GITHUB_OUTPUT}"

  deploy:
    needs: envs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: peaceiris/workflows/setup-node@99f66a30a38f806fd0df9014275c7cef0b6d9ca5 # v0.21.6
        with:
          node-version: "${{ needs.envs.outputs.NODE_VERSION }}"
          cache: "npm"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "${{ needs.envs.outputs.HUGO_VERSION }}"
          dart-sass-version: "1.108.2"

      - uses: peaceiris/workflows/setup-node@2ac268509a354f2a6098d9995de4ab44f4f038b1 # v0.22.0
        with:
          node-version: "${{ needs.envs.outputs.NODE_VERSION }}"
          npm-version: "${{ needs.envs.outputs.NPM_VERSION }}"
          cache: "npm"

      - run: make npm-ci

      - run: make fetch-data
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # Dependabot builds use the committed public GitHub data fixture, never GH_PAT.
      - name: Fetch preview images without credentials
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        working-directory: exampleSite
        run: node scripts/fetch_images.mjs

      - name: Test preview boundary helpers
        run: |
          node --test tests/netlify-preview.test.cjs
          python3 -m unittest discover -s tests -p 'test_netlify_preview.py'

      - run: make build-staging

      # Capture staging output before build-prod overwrites the publish directory.
      - name: Upload Dependabot preview artifact
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netlify-preview-${{ github.event.pull_request.head.sha }}
          # Preview is static-only: no routing directives, custom domain, or CMS config.
          path: |
            exampleSite/public
            !exampleSite/public/CNAME
            !exampleSite/public/_redirects
            !exampleSite/public/admin/config.yml
            !exampleSite/public/posts/hugo-136/literal:colon/index.html
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          include-hidden-files: false

      - name: Deploy to Netlify
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]') }}
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: "./exampleSite/public"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

      - run: make build-prod

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          #deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exampleSite/public
          allow_empty_commit: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

  lighthouse:
    needs: [envs, deploy]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/workflows/setup-node@2ac268509a354f2a6098d9995de4ab44f4f038b1 # v0.22.0
        with:
          node-version-file: ".nvmrc"
          npm-version: "${{ needs.envs.outputs.NPM_VERSION }}"
          cache: "npm"

      - name: Install lighthouse
        run: npm i -g lighthouse@11.7.1

      - name: Run lighthouse
        run: |
          lighthouse \
            --chrome-flags="--headless" \
            --output html --output-path ./report.html \
            'https://hugothemeiris.peaceiris.com'

      - name: Upload result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: report.html

      - name: Prepare assets
        run: |
          mkdir ./public
          cp ./report.html ./public/report.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./public
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

  docker:
    needs: envs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/workflows/setup-node@2ac268509a354f2a6098d9995de4ab44f4f038b1 # v0.22.0
        with:
          node-version: "${{ needs.envs.outputs.NODE_VERSION }}"
          npm-version: "${{ needs.envs.outputs.NPM_VERSION }}"
          cache: "npm"

      - name: prepare
        run: |
          sed -i 's/enableGitInfo: true/# enableGitInfo: true/' exampleSite/config/_default/config.yaml

      - run: make docker-build

  setup:
    needs: envs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peaceiris/workflows/setup-node@99f66a30a38f806fd0df9014275c7cef0b6d9ca5 # v0.21.6
        with:
          node-version: "${{ needs.envs.outputs.NODE_VERSION }}"
          cache: "npm"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "${{ needs.envs.outputs.HUGO_VERSION }}"
          dart-sass-version: "1.108.2"

      - uses: peaceiris/workflows/setup-node@2ac268509a354f2a6098d9995de4ab44f4f038b1 # v0.22.0
        with:
          node-version: "${{ needs.envs.outputs.NODE_VERSION }}"
          npm-version: "${{ needs.envs.outputs.NPM_VERSION }}"
          cache: "npm"

      - uses: peaceiris/workflows/setup-git@99f66a30a38f806fd0df9014275c7cef0b6d9ca5 # v0.21.6
        with:
          flags: "--global"

      - name: Create a new Hugo project
        env:
          THEME_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir ~/homepage
          cp scripts/setup.sh ~
          cd ~
          bash ./setup.sh "homepage" "peaceiris" "${THEME_REF}"
          cd homepage
          npm ci
          hugo
